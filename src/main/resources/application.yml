server:
  port: 8080

spring:
  application:
    name: api-gateway

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # prod = JSON logs; add "logstash" to also ship them to ELK
  profiles:
    group:
      prod: json-logs

  cloud:
    gateway:
      # Browser clients: only these origins may call the API (comma-separated list)
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
            allowed-methods: GET, POST, PUT, PATCH, DELETE, OPTIONS
            allowed-headers: Authorization, Content-Type
            max-age: 3600

      # Filter order per route matters: AuthenticationFilter strips/sets identity headers before
      # RequestRateLimiter reads them; CircuitBreaker wraps the call to the service.
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/auth/**, /api/v1/users/**
          filters:
            - AuthenticationFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${GATEWAY_AUTH_REPLENISH_RATE:10}
                redis-rate-limiter.burstCapacity: ${GATEWAY_AUTH_BURST_CAPACITY:20}
                key-resolver: "#{@userKeyResolver}"
            - name: CircuitBreaker
              args:
                name: userService
                fallbackUri: forward:/fallback/user-service

        - id: candidate-service
          uri: lb://candidate-service
          predicates:
            - Path=/api/v1/candidates/**
          filters:
            - AuthenticationFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                key-resolver: "#{@userKeyResolver}"
            - name: CircuitBreaker
              args:
                name: candidateService
                fallbackUri: forward:/fallback/candidate-service

        - id: voting-service
          uri: lb://voting-service
          predicates:
            - Path=/api/v1/votes/**
          filters:
            - AuthenticationFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                key-resolver: "#{@userKeyResolver}"
            - name: CircuitBreaker
              args:
                name: votingService
                fallbackUri: forward:/fallback/voting-service

        - id: result-service
          uri: lb://result-service
          predicates:
            - Path=/api/v1/results/**
          filters:
            - AuthenticationFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@userKeyResolver}"
            - name: CircuitBreaker
              args:
                name: resultService
                fallbackUri: forward:/fallback/result-service

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
        register-health-indicator: true
  timelimiter:
    configs:
      default:
        # Long enough for a vote including the voting-service's own retries to the Candidate Service
        timeout-duration: 5s

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, info
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      # 0.0 locally: trace ids still appear in logs but nothing is exported; docker-compose sets 1.0
      probability: ${TRACING_SAMPLING:0.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}
  health:
    circuitbreakers:
      enabled: true

logging:
  logstash:
    destination: ${LOGSTASH_HOST:localhost}:${LOGSTASH_PORT:5000}
